<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chess Set</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
:root{ --gold:#e8a93a; --cream:#f6efe1; --light:#ecd9b6; --dark:#a5754a; color-scheme:dark; }
*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; height:100%; }
body{ font-family:Nunito, system-ui, sans-serif; color:var(--cream); background:radial-gradient(ellipse at 50% 30%, #3a2a1e, #150e09 75%); display:flex; flex-direction:column; }
button{ font:inherit; cursor:pointer; }
:focus-visible{ outline:3px solid var(--gold); outline-offset:2px; }
.btn{ border:2px solid var(--cream); background:transparent; color:var(--cream); border-radius:12px; padding:8px 14px; font-weight:900; }
.btn.primary{ background:var(--gold); border-color:var(--gold); color:#1d1719; }
.btn[aria-pressed="true"]{ background:var(--cream); color:#1d1719; }
h1{ font-family:Bungee, Impact, sans-serif; font-weight:400; margin:0; font-size:22px; margin-right:auto; }
.top{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:8px 14px; background:rgba(0,0,0,.35); }
.wrap{ flex:1; min-height:0; display:flex; gap:22px; align-items:center; justify-content:center; padding:14px; flex-wrap:wrap; }
.boardbox{ position:relative; }
#board{ --sq:min(10.5vh, 10.5vw, 76px); display:grid; grid-template-columns:repeat(8, var(--sq)); grid-template-rows:repeat(8, var(--sq)); border:10px solid #4a2e18; border-radius:8px; box-shadow:0 20px 50px rgba(0,0,0,.6); }
.sq{ position:relative; border:0; padding:0; display:flex; align-items:center; justify-content:center; font-size:calc(var(--sq) * .78); line-height:1; }
.sq.l{ background:var(--light); } .sq.d{ background:var(--dark); }
.sq.last{ box-shadow:inset 0 0 0 100px rgba(232,169,58,.35); }
.sq.sel{ box-shadow:inset 0 0 0 4px #2b7de9, inset 0 0 0 100px rgba(43,125,233,.25); }
.sq.check{ box-shadow:inset 0 0 0 100px rgba(214,40,40,.55); }
.sq .dot{ position:absolute; width:30%; height:30%; border-radius:50%; background:rgba(20,20,20,.35); pointer-events:none; }
.sq .ring{ position:absolute; inset:6%; border-radius:50%; border:5px solid rgba(20,20,20,.35); pointer-events:none; }
.sq .coord{ position:absolute; font-size:11px; font-weight:900; opacity:.6; }
.sq .coord.f{ right:3px; bottom:2px; } .sq .coord.r{ left:3px; top:2px; }
.sq.l .coord{ color:#a5754a; } .sq.d .coord{ color:#ecd9b6; }
.pc{ pointer-events:none; user-select:none; }
.pc.w{ color:#fffaf0; text-shadow:0 0 1px #000, 0 0 2px #000, 0 2px 3px rgba(0,0,0,.6); }
.pc.b{ color:#1d1719; text-shadow:0 0 1px #fff8, 0 2px 3px rgba(0,0,0,.35); }
.side{ width:260px; max-width:92vw; display:flex; flex-direction:column; gap:12px; }
.panel{ background:rgba(0,0,0,.3); border-radius:14px; padding:12px; }
.status{ font-weight:900; font-size:18px; min-height:48px; }
.capt{ font-size:24px; min-height:30px; letter-spacing:-2px; }
#moves{ max-height:220px; overflow:auto; font-size:14px; font-weight:700; columns:2; }
.ov{ position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.6); z-index:20; }
.ov.on{ display:flex; }
.ov .panel{ background:#241a13; padding:24px; text-align:center; display:flex; flex-direction:column; gap:12px; align-items:center; max-width:380px; }
.ov h2{ font-family:Bungee, Impact, sans-serif; font-weight:400; margin:0; font-size:30px; }
.promo{ display:flex; gap:8px; } .promo button{ font-size:44px; width:70px; height:70px; border-radius:12px; border:0; background:var(--light); }
.row{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
</style>
</head>
<body>
<div class="top">
  <h1>Chess Set</h1>
  <span class="row" role="group" aria-label="Opponent"><button class="btn" id="mCpu">Vs computer</button><button class="btn" id="m2p">2 players</button></span>
  <span class="row" role="group" aria-label="Difficulty" id="diffRow"><button class="btn" data-d="1">Easy</button><button class="btn" data-d="2">Medium</button><button class="btn" data-d="4">Hard</button></span>
  <button class="btn" id="undo">Undo</button>
  <button class="btn" id="flip">Flip board</button>
  <button class="btn primary" id="newg">New game</button>
</div>
<div class="wrap">
  <div class="boardbox"><div id="board" role="grid" aria-label="Chess board"></div></div>
  <div class="side">
    <div class="panel status" id="status" aria-live="polite"></div>
    <div class="panel"><b>Captured</b><div class="capt" id="capW"></div><div class="capt" id="capB"></div></div>
    <div class="panel"><b>Moves</b><ol id="moves"></ol></div>
  </div>
</div>
<div class="ov" id="promoOv"><div class="panel"><h2>Promote to</h2><div class="promo" id="promo"></div></div></div>
<div class="ov" id="endOv"><div class="panel"><h2 id="endT"></h2><p id="endP"></p><button class="btn primary" id="endBtn">Play again</button></div></div>
<script>
const $ = s => document.querySelector(s);

  N:[-50,-40,-30,-30,-30,-30,-40,-50,-40,-20,0,0,0,0,-20,-40,-30,0,10,15,15,10,0,-30,-30,5,15,20,20,15,5,-30,-30,0,15,20,20,15,0,-30,-30,5,10,15,15,10,5,-30,-40,-20,0,5,5,0,-20,-40,-50,-40,-30,-30,-30,-30,-40,-50],

  R:[0,0,0,0,0,0,0,0,5,10,10,10,10,10,10,5,-5,0,0,0,0,0,0,-5,-5,0,0,0,0,0,0,-5,-5,0,0,0,0,0,0,-5,-5,0,0,0,0,0,0,-5,-5,0,0,0,0,0,0,-5,0,0,0,5,5,0,0,0],

function make(s, m) {

}
const kingSq = (s, c) => s.b.indexOf(c === 'w' ? 'K' : 'k');
function legal(s) { const me = s.turn, opp = me === 'w' ? 'b' : 'w'; return pseudo(s).filter(m => { const n = make(s, m); return !attacked(n, kingSq(n, me), opp); }); }
const inCheck = s => attacked(s, kingSq(s, s.turn), s.turn === 'w' ? 'b' : 'w');
function evaluate(s) {

}

function play(m) {

function clickSq(i) {

}
let AC; function tone(f) { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); const o = AC.createOscillator(), g = AC.createGain(); o.type = 'triangle'; o.frequency.value = f; g.gain.setValueAtTime(.08, AC.currentTime); g.gain.exponentialRampToValueAtTime(.001, AC.currentTime + .12); o.connect(g).connect(AC.destination); o.start(); o.stop(AC.currentTime + .13); } catch (e) {} }

$('#newg').onclick = newGame; $('#endBtn').onclick = newGame;

<script>window.__V3 = { key:'chess', top:'.top', before:'#newg', stage:'.boardbox', target:'#board', tilt:48, spin:true, followable:true, focusZoom:1.7, preserve:['.sq'], billboard:'.is3d #board .pc', bbOrigin:'50% 92%', extraCss:'.wrap{ overflow:hidden; } .top{ position:relative; z-index:10; } .is3d #board .sq{ transform:translateZ(1px); } .is3d #board .pc{ font-size:1.25em; display:inline-block; margin-top:-28%; }' };</script>
<script>
/* 3D view, follow camera and zoom add-on. Config: window.__V3 */

${C.target}{ transform-style:preserve-3d; transition:transform .75s cubic-bezier(.3,.7,.2,1); transform:${TF}; }
${C.target}.v3-follow{ transition:transform .5s ease-out; }
${(C.preserve || []).length ? C.preserve.join(',') + '{ transform-style:preserve-3d; }' : ''}

  rr.onclick = () => { st.spin += 45; apply(); };

})();
