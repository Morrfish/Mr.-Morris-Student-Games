<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bingo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
:root{ --gold:#e8a93a; --cream:#f6efe1; color-scheme:dark; }
*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; height:100%; }
body{ font-family:Nunito, system-ui, sans-serif; color:var(--cream); background:radial-gradient(ellipse at 50% 30%, #2a3f6b, #0f1730 80%); display:flex; flex-direction:column; overflow:hidden; }
button{ font:inherit; cursor:pointer; }
[hidden]{ display:none !important; }
:focus-visible{ outline:3px solid var(--gold); outline-offset:2px; }
.btn{ border:2px solid var(--cream); background:transparent; color:var(--cream); border-radius:12px; padding:9px 16px; font-weight:900; }
.btn.primary{ background:var(--gold); border-color:var(--gold); color:#1d1719; }
.btn[aria-pressed="true"]{ background:var(--cream); color:#1d1719; }
.btn.bingo{ background:#c0182a; border-color:#c0182a; color:#fff; font-family:Bungee, Impact, sans-serif; font-weight:400; font-size:26px; padding:10px 28px; }
h1{ font-family:Bungee, Impact, sans-serif; font-weight:400; margin:0; font-size:22px; margin-right:auto; }
.top{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:8px 14px; background:rgba(0,0,0,.4); position:relative; z-index:10; }
.hall{ flex:1; min-height:0; display:flex; gap:16px; padding:14px; overflow:hidden; }
.callcol{ width:300px; display:flex; flex-direction:column; gap:12px; }
.ball{ width:150px; height:150px; border-radius:50%; align-self:center; background:radial-gradient(circle at 35% 30%, #fff, #f2ecdd 40%, #cfc6b0); color:#1d1719; display:flex; flex-direction:column; align-items:center; justify-content:center; box-shadow:0 14px 24px rgba(0,0,0,.45); }
.ball b{ font-family:Bungee, Impact, sans-serif; font-weight:400; font-size:28px; color:#c0182a; line-height:1; }
.ball span{ font-family:Bungee, Impact, sans-serif; font-size:54px; line-height:1; }
.ball.pop{ animation:pop .5s; } @keyframes pop{ from{ transform:scale(.4) rotate(-90deg); } to{ transform:none; } }
.board75{ display:grid; grid-template-columns:28px repeat(15, 1fr); gap:2px; font-size:11px; font-weight:900; }
.board75 .h{ font-family:Bungee, Impact, sans-serif; color:var(--gold); font-size:14px; display:flex; align-items:center; justify-content:center; }
.board75 .n{ background:rgba(255,255,255,.08); border-radius:4px; text-align:center; padding:3px 0; color:#8c9ab8; }
.board75 .n.on{ background:var(--gold); color:#1d1719; }
.panel{ background:rgba(0,0,0,.3); border-radius:14px; padding:12px; }
.mid{ flex:1; min-width:0; display:flex; flex-direction:column; gap:12px; align-items:center; justify-content:center; }
#tableTop{ display:flex; flex-direction:column; align-items:center; gap:12px; }
.card{ background:#fffdf6; color:#1d1719; border-radius:16px; padding:12px; box-shadow:0 20px 40px rgba(0,0,0,.45); }
.card .head{ display:grid; grid-template-columns:repeat(5, 1fr); text-align:center; font-family:Bungee, Impact, sans-serif; font-size:32px; color:#fff; background:#c0182a; border-radius:10px 10px 0 0; }
.card .grid{ display:grid; grid-template-columns:repeat(5, var(--cell, 74px)); gap:4px; padding-top:4px; }
.cell{ height:var(--cell, 74px); border:0; border-radius:8px; background:#efe7d3; color:#1d1719; font-weight:900; font-size:calc(var(--cell, 74px) * .38); position:relative; }
.cell.free{ font-size:calc(var(--cell, 74px) * .2); }
.cell.dab::after{ content:""; position:absolute; inset:10%; border-radius:50%; background:radial-gradient(circle at 40% 35%, rgba(255,120,200,.95), rgba(214,40,140,.85)); mix-blend-mode:multiply; }
.cell.win{ outline:4px solid var(--gold); }
.msg{ font-weight:900; font-size:18px; text-align:center; min-height:26px; }
.opps{ width:240px; display:flex; flex-direction:column; gap:10px; overflow:auto; }
.mini .grid{ --cell:30px; } .mini .head{ font-size:15px; } .mini{ padding:8px; }
.mini .cell{ font-size:12px; }
.oname{ font-weight:900; text-align:center; margin-bottom:4px; }
.ov{ position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.6); z-index:40; padding:20px; }
.ov.on{ display:flex; }
.ov .panel{ background:#18213d; padding:24px; max-width:500px; width:100%; display:flex; flex-direction:column; gap:12px; align-items:center; text-align:center; }
.ov h2{ font-family:Bungee, Impact, sans-serif; font-weight:400; margin:0; font-size:32px; }
.row{ display:flex; gap:6px; flex-wrap:wrap; justify-content:center; align-items:center; }
@media (max-width:1000px){ .hall{ flex-direction:column; overflow:auto; } .callcol, .opps{ width:100%; } .opps{ flex-direction:row; flex-wrap:wrap; justify-content:center; } .card .grid{ --cell:58px; } }
@media (prefers-reduced-motion: reduce){ .ball.pop{ animation:none; } }
</style>
</head>
<body>
<div class="top"><h1>Bingo</h1><button class="btn" id="voiceBtn" aria-pressed="true">Caller voice: on</button><button class="btn primary" id="newg">New game</button></div>
<div class="hall">
  <aside class="callcol">
    <div class="ball" id="ball" aria-live="polite"><b>B</b><span>–</span></div>
    <div class="row"><button class="btn primary" id="callBtn">Call next number</button><button class="btn" id="autoBtn" aria-pressed="false">Auto call</button></div>
    <div class="panel"><div class="board75" id="board75"></div></div>
  </aside>
  <main class="mid" id="midStage"><div id="tableTop"><div class="msg" id="msg"></div><div class="card" id="myCard"></div><button class="btn bingo" id="bingoBtn">BINGO!</button></div></main>
  <aside class="opps" id="opps"></aside>
</div>
<div class="ov on" id="setupOv"><div class="panel"><h2>Bingo</h2>
  <p>Pick a pattern and how many computer players.</p>
  <div class="row" id="patRow"></div>
  <div class="row" id="oppRow"></div>
  <div class="row" id="speedRow"></div>
  <button class="btn primary" id="go">Let’s play</button></div></div>
<div class="ov" id="winOv"><div class="panel"><h2 id="winT"></h2><p id="winP"></p><div class="row"><button class="btn primary" id="again">Play again</button><button class="btn" id="change">Change settings</button></div></div></div>
<script>
const $ = s => document.querySelector(s);
const L = 'BINGO';
const PATTERNS = { line:'Any line', corners:'Four corners', x:'Big X', blackout:'Blackout' };
let cfg = { pat:'line', opps:3, speed:6 }; try { Object.assign(cfg, JSON.parse(localStorage.getItem('bingo-cfg') || '{}')); } catch (e) {}
let voice = true; try { voice = localStorage.getItem('bingo-voice') !== 'off'; } catch (e) {}
let G = null, timer = null;
let AC; function tone(f, d = .1) { try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); const o = AC.createOscillator(), g = AC.createGain(); o.type = 'triangle'; o.frequency.value = f; g.gain.setValueAtTime(.07, AC.currentTime); g.gain.exponentialRampToValueAtTime(.001, AC.currentTime + d); o.connect(g).connect(AC.destination); o.start(); o.stop(AC.currentTime + d + .02); } catch (e) {} }
function speak(t) { if (!voice || !window.speechSynthesis) return; try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.rate = .9; speechSynthesis.speak(u); } catch (e) {} }
const letterOf = n => L[Math.floor((n - 1) / 15)];
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function makeCard() { const cols = [...Array(5)].map((_, c) => shuffle([...Array(15)].map((_, i) => c * 15 + i + 1)).slice(0, 5)); const g = []; for (let r = 0; r < 5; r++) for (let c = 0; c < 5; c++) g.push(r === 2 && c === 2 ? 0 : cols[c][r]); return { g, dab:new Set([12]) }; }
function lines(pat) {
  const L5 = [...Array(5).keys()];
  if (pat === 'corners') return [[0, 4, 20, 24]];
  if (pat === 'x') return [[0, 6, 12, 18, 24, 4, 8, 16, 20]];
  if (pat === 'blackout') return [[...Array(25).keys()]];
  const out = []; L5.forEach(r => out.push(L5.map(c => r * 5 + c))); L5.forEach(c => out.push(L5.map(r => r * 5 + c))); out.push([0, 6, 12, 18, 24], [4, 8, 12, 16, 20]); return out;
}
function winLine(card, called) { const ok = i => i === 12 || (card.dab.has(i) && called.has(card.g[i])); return lines(G.pat).find(l => l.every(ok)); }
function setup() {
  const seg = (id, items, key) => { $(id).innerHTML = items.map(([v, l]) => `<button class="btn" data-v="${v}" aria-pressed="${cfg[key] == v}">${l}</button>`).join(''); $(id).querySelectorAll('button').forEach(b => b.onclick = () => { cfg[key] = isNaN(+b.dataset.v) ? b.dataset.v : +b.dataset.v; setup(); }); };
  seg('#patRow', Object.entries(PATTERNS), 'pat');
  seg('#oppRow', [[0, 'Just me'], [1, '1 computer'], [2, '2 computers'], [3, '3 computers']], 'opps');
  seg('#speedRow', [[9, 'Slow calls'], [6, 'Medium calls'], [3, 'Fast calls']], 'speed');
  $('#setupOv').classList.add('on');
}
$('#go').onclick = () => { try { localStorage.setItem('bingo-cfg', JSON.stringify(cfg)); } catch (e) {} start(); };
$('#newg').onclick = () => { stopAuto(); setup(); };
$('#again').onclick = () => start(); $('#change').onclick = () => { $('#winOv').classList.remove('on'); setup(); };
$('#voiceBtn').onclick = () => { voice = !voice; try { localStorage.setItem('bingo-voice', voice ? 'on' : 'off'); } catch (e) {} $('#voiceBtn').setAttribute('aria-pressed', voice); $('#voiceBtn').textContent = voice ? 'Caller voice: on' : 'Caller voice: off'; };
function start() {
  stopAuto(); $('#setupOv').classList.remove('on'); $('#winOv').classList.remove('on');
  G = { pat:cfg.pat, bag:shuffle([...Array(75)].map((_, i) => i + 1)), called:new Set(), last:null, me:makeCard(), opps:[...Array(cfg.opps)].map((_, i) => ({ name:`Computer ${i + 1}`, card:makeCard(), wait:0 })), over:false };
  $('#msg').textContent = `Pattern: ${PATTERNS[G.pat]}. Dab called numbers on your card, then shout BINGO!`;
  render(); $('#ball').innerHTML = '<b>Ready</b><span>?</span>';
}
function call() {
  if (!G || G.over || !G.bag.length) return;
  const n = G.bag.pop(); G.called.add(n); G.last = n;
  const b = $('#ball'); b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop'); b.innerHTML = `<b>${letterOf(n)}</b><span>${n}</span>`;
  tone(660); speak(`${letterOf(n)}, ${n}`);
  G.opps.forEach(o => { const i = o.card.g.indexOf(n); if (i >= 0) o.card.dab.add(i); if (!o.wait && winLine(o.card, G.called)) o.wait = 1 + Math.floor(Math.random() * 2); });
  render();
  const ready = G.opps.find(o => o.wait && --o.wait === 0);
  if (ready) setTimeout(() => G && !G.over && winner(ready.name, ready.card), 900);
  if (!G.bag.length) { stopAuto(); $('#msg').textContent = 'All 75 numbers are called!'; }
}
function render() {
  $('#board75').innerHTML = [...L].map((l, c) => `<div class="h">${l}</div>` + [...Array(15)].map((_, i) => { const n = c * 15 + i + 1; return `<div class="n${G.called.has(n) ? ' on' : ''}">${n}</div>`; }).join('')).join('');
  const winL = G.over && G.winCard === G.me ? G.winLine : [];
  $('#myCard').innerHTML = `<div class="head">${[...L].map(l => `<span>${l}</span>`).join('')}</div><div class="grid">${G.me.g.map((n, i) => `<button class="cell${i === 12 ? ' free dab' : G.me.dab.has(i) ? ' dab' : ''}${winL.includes(i) ? ' win' : ''}" data-i="${i}" aria-label="${i === 12 ? 'Free space' : letterOf(n) + ' ' + n}${G.me.dab.has(i) ? ', dabbed' : ''}" aria-pressed="${G.me.dab.has(i)}">${i === 12 ? 'FREE' : n}</button>`).join('')}</div>`;
  $('#myCard').querySelectorAll('.cell').forEach(b => b.onclick = () => { const i = +b.dataset.i; if (i === 12 || G.over) return; G.me.dab.has(i) ? G.me.dab.delete(i) : G.me.dab.add(i); tone(G.called.has(G.me.g[i]) ? 900 : 300, .06); render(); });
  $('#opps').innerHTML = G.opps.map(o => `<div class="card mini"><div class="oname">${o.name}</div><div class="head">${[...L].map(l => `<span>${l}</span>`).join('')}</div><div class="grid">${o.card.g.map((n, i) => `<div class="cell${i === 12 ? ' free dab' : o.card.dab.has(i) ? ' dab' : ''}">${i === 12 ? '★' : n}</div>`).join('')}</div></div>`).join('');
  $('#callBtn').disabled = G.over;
}
$('#callBtn').onclick = call;
function stopAuto() { clearInterval(timer); timer = null; $('#autoBtn').setAttribute('aria-pressed', 'false'); $('#autoBtn').textContent = 'Auto call'; }
$('#autoBtn').onclick = () => { if (timer) return stopAuto(); if (!G) return; call(); timer = setInterval(call, cfg.speed * 1000); $('#autoBtn').setAttribute('aria-pressed', 'true'); $('#autoBtn').textContent = 'Stop auto call'; };
$('#bingoBtn').onclick = () => {
  if (!G || G.over) return;
  const l = winLine(G.me, G.called);
  if (l) return winner('You', G.me, l);
  const wrong = [...G.me.dab].filter(i => i !== 12 && !G.called.has(G.me.g[i])).length;
  $('#msg').textContent = wrong ? `Not yet! ${wrong} of your dabs ${wrong === 1 ? 'hasn’t' : 'haven’t'} been called.` : `Not yet! You need ${PATTERNS[G.pat].toLowerCase()}.`; tone(200, .3);
};
function winner(name, card, l) {
  G.over = true; G.winCard = card; G.winLine = l || winLine(card, G.called); stopAuto(); render(); speak(name === 'You' ? 'Bingo! You win!' : `Bingo! ${name} wins!`);
  $('#winT').textContent = name === 'You' ? 'BINGO! You win!' : `${name} got BINGO`; $('#winP').textContent = `${PATTERNS[G.pat]} after ${G.called.size} numbers.`;
  setTimeout(() => $('#winOv').classList.add('on'), 900); tone(523, .2); setTimeout(() => tone(659, .2), 140); setTimeout(() => tone(784, .3), 280);
}
document.addEventListener('keydown', e => { if (e.key === ' ' && !$('.ov.on') && e.target === document.body) { e.preventDefault(); call(); } });
$('#voiceBtn').setAttribute('aria-pressed', voice); $('#voiceBtn').textContent = voice ? 'Caller voice: on' : 'Caller voice: off';
setup();
</script>
<script>window.__V3 = { key:'bingo', top:'.top', before:'#newg', stage:'#midStage', target:'#tableTop', tilt:34, spin:false, followable:false, persp:1400, extraCss:'.top{ position:relative; z-index:10; } #midStage{ overflow:hidden; }' };</script>
<script>
/* 3D view, follow camera and zoom add-on. Config: window.__V3 */
(function () {
  const C = window.__V3, root = document.documentElement;
  const st = { on:false, tilt:C.tilt || 50, spin:0, zoom:1, follow:true };
  try { Object.assign(st, JSON.parse(localStorage.getItem('v3-' + C.key) || '{}')); } catch (e) {}
  st.zoom = Math.max(1, Math.min(3, st.zoom || 1));
  const cam = { z:1, x:null, y:null, px:0, py:0 };
  const TF = C.transform || 'translate(var(--px, 0px), var(--py, 0px)) scale(var(--zoom, 1)) rotateX(var(--tilt, 0deg)) rotateZ(var(--spin, 0deg)) translate(var(--cx, 0px), var(--cy, 0px))';
  const css = document.createElement('style');
  css.textContent = `
${C.stage}{ perspective:${C.persp || 1700}px; perspective-origin:50% ${C.originY || '35%'}; }
${C.target}{ transform-style:preserve-3d; transition:transform .75s cubic-bezier(.3,.7,.2,1); transform:${TF}; }
${C.target}.v3-follow{ transition:transform .5s ease-out; }
${(C.preserve || []).length ? C.preserve.join(',') + '{ transform-style:preserve-3d; }' : ''}
${C.billboard ? `${C.billboard}{ transform:rotateZ(calc(var(--spin, 0deg) * -1)) rotateX(calc(var(--tilt, 0deg) * -1)); transform-origin:${C.bbOrigin || '50% 90%'}; }` : ''}
.v3-drag ${C.target}, .v3-drag ${C.billboard || '.__none'}{ transition:none !important; }
${C.extraCss || ''}
@media (prefers-reduced-motion: reduce){ ${C.target}{ transition:none !important; } }`;
  document.head.appendChild(css);
  const bar = document.querySelector(C.top), where = C.before ? bar.querySelector(C.before) : null;
  const mk = (label, aria) => { const b = document.createElement('button'); b.className = C.btnClass || 'btn'; b.textContent = label; if (aria) b.setAttribute('aria-label', aria); (where ? bar.insertBefore(b, where) : bar.appendChild(b)); return b; };
  const tgl = mk('3D view'), rl = mk('⟲', 'Rotate left'), rr = mk('⟳', 'Rotate right');
  const zo = mk('−', 'Zoom out'), zi = mk('+', 'Zoom in');
  const fol = C.followable ? mk('Follow camera') : null;
  const tgt = () => document.querySelector(C.target);
  function setVars() {
    const el = tgt(); if (!el) return;
    const z = Math.max(st.zoom, cam.z);
    root.style.setProperty('--tilt', st.on ? st.tilt + 'deg' : '0deg');
    root.style.setProperty('--spin', st.on && C.spin ? st.spin + 'deg' : '0deg');
    root.style.setProperty('--zoom', z);
    const w = el.offsetWidth, h = el.offsetHeight;
    const fx = cam.x == null ? w / 2 : cam.x, fy = cam.y == null ? h / 2 : cam.y;
    root.style.setProperty('--cx', (w / 2 - fx) + 'px'); root.style.setProperty('--cy', (h / 2 - fy) + 'px');
    root.style.setProperty('--px', cam.px + 'px'); root.style.setProperty('--py', cam.py + 'px');
  }
  function apply() {
    root.classList.toggle('is3d', st.on);
    tgl.textContent = st.on ? '2D view' : '3D view'; tgl.setAttribute('aria-pressed', st.on);
    rl.hidden = rr.hidden = !(st.on && C.spin);
    if (fol) { fol.setAttribute('aria-pressed', st.follow); fol.textContent = st.follow ? 'Follow camera: on' : 'Follow camera: off'; }
    zo.disabled = st.zoom <= 1; zi.disabled = st.zoom >= 3;
    try { localStorage.setItem('v3-' + C.key, JSON.stringify(st)); } catch (e) {}
    setVars(); if (C.onChange) C.onChange(st);
  }
  tgl.onclick = () => { st.on = !st.on; apply(); };
  rl.onclick = () => { st.spin -= 45; apply(); };
  rr.onclick = () => { st.spin += 45; apply(); };
  zi.onclick = () => { st.zoom = Math.min(3, +(st.zoom + .25).toFixed(2)); apply(); };
  zo.onclick = () => { st.zoom = Math.max(1, +(st.zoom - .25).toFixed(2)); if (st.zoom === 1) { cam.px = cam.py = 0; } apply(); };
  if (fol) fol.onclick = () => { st.follow = !st.follow; if (!st.follow) api.wide(); apply(); };
  function localPos(el) {
    const T = tgt(); let x = el.offsetWidth / 2, y = el.offsetHeight / 2, n = el;
    while (n && n !== T) { x += n.offsetLeft; y += n.offsetTop; n = n.offsetParent; if (n && !T.contains(n) && n !== T) break; }
    return [x, y];
  }
  let backT = null;
  const api = window.__cam = {
    focus(x, y, z, follow) { if (!st.follow || !C.followable) return; clearTimeout(backT); cam.x = x; cam.y = y; cam.z = z || C.focusZoom || 1.8; tgt().classList.toggle('v3-follow', !!follow); setVars(); },
    focusEl(el, z, back) { if (!el || !st.follow || !C.followable) return; const [x, y] = localPos(el); api.focus(x, y, z); if (back) { clearTimeout(backT); backT = setTimeout(api.wide, back); } },
    wide() { clearTimeout(backT); cam.x = cam.y = null; cam.z = 1; const el = tgt(); if (el) el.classList.remove('v3-follow'); setVars(); },
    state:st, cam,
    pan(px, py) { cam.px = px; cam.py = py; setVars(); },
    zoomBy(dz) { st.zoom = Math.max(1, Math.min(3, +(st.zoom + dz).toFixed(2))); if (st.zoom === 1) cam.px = cam.py = 0; apply(); }
  };
  if (C.drag) {
    const stage = document.querySelector(C.stage); let d = null;
    stage.addEventListener('pointerdown', e => { if (!st.on || e.target.closest('button, input, .no-orbit')) return; d = { x:e.clientX, y:e.clientY, spin:st.spin, tilt:st.tilt }; stage.setPointerCapture(e.pointerId); root.classList.add('v3-drag'); });
    stage.addEventListener('pointermove', e => { if (!d) return; if (C.spin) st.spin = d.spin + (e.clientX - d.x) * .35; st.tilt = Math.max(20, Math.min(68, d.tilt - (e.clientY - d.y) * .2)); apply(); });

})();

</script>
